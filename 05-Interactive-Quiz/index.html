
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #182b55, #7657a8);
}

.quiz {
    background: white;
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 40px #0003;
}

h1 {
    color: #705cdb;
}

.progress {
    background: #eee;
    height: 8px;
    border-radius: 10px;
    margin: 20px 0;
}

.bar {
    height: 8px;
    width: 0%;
    background: #705cdb;
    border-radius: 10px;
}

.question {
    font-size: 20px;
    font-weight: bold;
    margin: 25px 0;
}

.answers {
    display: grid;
    gap: 12px;
}

.answers button {
    padding: 14px;
    text-align: left;
    border: 1px solid #ddd;
    background: #f8f8ff;
    border-radius: 10px;
    cursor: pointer;
}

.answers button:hover:not(:disabled) {
    background: #e9e5ff;
}

.answers button.correct {
    background: #d9f8e5;
    border-color: #42aa70;
}

.answers button.wrong {
    background: #ffe0e0;
    border-color: #e16a6a;
}

.next {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: #705cdb;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.next:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.result {
    text-align: center;
    padding: 20px;
}

.score {
    font-size: 40px;
    color: #705cdb;
    font-weight: bold;
}
</style>
</head>

<body>

<main class="quiz">

<div id="game">

<h1>🧠 Knowledge Quiz</h1>
<p>Test your web development knowledge!</p>

<div id="progressText">Question 1 / 5</div>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<div class="question" id="question"></div>

<div class="answers" id="answers"></div>

<button class="next" id="next" disabled>
    Next Question
</button>

</div>

<div class="result" id="result" hidden></div>

</main>

<script>

const questions = [

{
    question: "What does HTML stand for?",
    answers: [
        "Hyper Text Markup Language",
        "High Text Machine Language",
        "Hyper Tool Multi Language",
        "Home Text Markup Language"
    ],
    correct: 0
},

{
    question: "Which language styles web pages?",
    answers: [
        "Java",
        "Python",
        "CSS",
        "SQL"
    ],
    correct: 2
},

{
    question: "Which tag creates a hyperlink?",
    answers: [
        "<link>",
        "<a>",
        "<href>",
        "<url>"
    ],
    correct: 1
},

{
    question: "Which method converts JSON into a JavaScript object?",
    answers: [
        "JSON.make()",
        "JSON.read()",
        "JSON.parse()",
        "JSON.convert()"
    ],
    correct: 2
},

{
    question: "Which browser feature stores data locally?",
    answers: [
        "LocalStorage",
        "HTML",
        "CSS",
        "Fetch"
    ],
    correct: 0
}

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function displayQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("progressText").textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("bar").style.width =
        (currentQuestion / questions.length * 100) + "%";

    document.getElementById("question").textContent =
        q.question;

    const answers = document.getElementById("answers");

    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.textContent = answer;

        button.onclick = () => checkAnswer(index, button);

        answers.appendChild(button);

    });

    document.getElementById("next").disabled = true;

}

function checkAnswer(selected, button) {

    if (answered) return;

    answered = true;

    const correct = questions[currentQuestion].correct;

    const buttons = document.querySelectorAll(".answers button");

    buttons.forEach((btn, index) => {

        btn.disabled = true;

        if (index === correct) {
            btn.classList.add("correct");
        }

    });

    if (selected === correct) {

        score++;

    } else {

        button.classList.add("wrong");

    }

    document.getElementById("next").disabled = false;

}

document.getElementById("next").onclick = function() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        displayQuestion();

    } else {

        showResult();

    }

};

function showResult() {

    document.getElementById("game").hidden = true;

    const result = document.getElementById("result");

    result.hidden = false;

    document.getElementById("bar").style.width = "100%";

    result.innerHTML = `
        <h1>Quiz Completed! 🎉</h1>

        <p>Your Final Score</p>

        <div class="score">
            ${score} / ${questions.length}
        </div>

        <p>
            ${score === 5
            ? "Excellent! Perfect Score!"
            : "Great effort! Keep learning!"}
        </p>

        <button class="next" onclick="location.reload()">
            Try Again
        </button>
    `;

}

displayQuestion();

</script>

</body>
</html>
